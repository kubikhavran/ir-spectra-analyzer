repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        # Tests and build scripts intentionally use dynamic fixtures/runtime
        # globals. Keep the hook focused on importable application code.
        exclude: ^(tests/|packaging/)
